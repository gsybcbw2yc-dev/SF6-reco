name: Collect SF6 ratings
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sf6-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          CFN_PLAYER_ID: "1866568348"
          BUCKLER_ID: ${{ secrets.BUCKLER_ID }}
        run: python collector/collect.py
      - name: Commit observations and status
        if: always()
        run: |
          git config user.name 'sf6-tracker-bot'
          git config user.email 'sf6-tracker-bot@users.noreply.github.com'
          git add web/data/history.json web/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record SF6 ratings observation'
            git push
          fi
