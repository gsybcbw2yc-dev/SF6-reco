name: Collect SF6 ratings
on:
  schedule:
    # Backup slots after external :00/:30 primary slots.
    - cron: '11 * * * *'
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: 'manual or cron_job_org'
        required: false
        default: manual
        type: choice
        options: [manual, cron_job_org]
      external_trigger_unix:
        description: 'cron-job.org execution Unix timestamp (optional)'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['collector/**', 'tests/**', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: sf6-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start from current history
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection logic
        run: python -m unittest discover -s tests -v
      - name: Test dashboard refresh
        run: |
          node tests/test_dashboard.cjs
          node tests/test_time_analysis.cjs
          node tests/test_match_analysis.cjs
          node tests/test_matches_ui.cjs
          node tests/test_time_performance.cjs
          node tests/test_deep_analysis.cjs
      - name: Collect
        env:
          CFN_PLAYER_ID: "1866568348"
          BUCKLER_ID: ${{ secrets.BUCKLER_ID }}
          MATCH_LOG_MODE: ingest
          MATCH_MAX_PAGES: '10'
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          COLLECTION_ORIGIN: ${{ inputs.origin }}
          EXTERNAL_TRIGGER_UNIX: ${{ inputs.external_trigger_unix }}
        run: python collector/collect.py
      - name: Commit observations and status
        if: always()
        run: |
          git config user.name 'sf6-tracker-bot'
          git config user.email 'sf6-tracker-bot@users.noreply.github.com'
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m 'Record SF6 ratings observation'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep "$attempt"
            done
            exit 1
          fi
  publish:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published data
        run: python collector/verify_pages.py
