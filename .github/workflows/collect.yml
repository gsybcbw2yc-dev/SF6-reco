name: Collect SF6 ratings
on:
  schedule:
    # Primary slots at :11/:41, backup opportunities at :26/:56.
    - cron: '11 * * * *'
    - cron: '26 * * * *'
    - cron: '41 * * * *'
    - cron: '56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', 'tests/**', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: sf6-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start from current history
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection logic
        run: python -m unittest discover -s tests -v
      - name: Collect
        env:
          CFN_PLAYER_ID: "1866568348"
          BUCKLER_ID: ${{ secrets.BUCKLER_ID }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python collector/collect.py
      - name: Commit observations and status
        if: always()
        run: |
          git config user.name 'sf6-tracker-bot'
          git config user.email 'sf6-tracker-bot@users.noreply.github.com'
          git add web/data/history.json web/data/status.json web/data/runs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record SF6 ratings observation'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep "$attempt"
            done
            exit 1
          fi
  publish:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published data
        run: python collector/verify_pages.py
